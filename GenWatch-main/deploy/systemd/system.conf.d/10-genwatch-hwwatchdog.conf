# Hardware watchdog for the host running GenWatch.
#
# These settings tell pid 1 (systemd) to pet a hardware watchdog at
# /dev/watchdog. If systemd itself hangs (kernel deadlock, OOM-killer
# storm, USB controller wedge, thermal panic), the watchdog circuit
# hard-resets the machine after the timeout. This is the only recovery
# mechanism that survives a kernel hang — the software watchdog on the
# GenWatch service cannot restart pid 1.
#
# WHETHER YOU ACTUALLY HAVE ONE DEPENDS ON THE HOST:
#   Raspberry Pi     — yes. bcm2835_wdt loads automatically on Pi OS.
#   Bare-metal x86   — usually. Intel TCO (iTCO_wdt) or an equivalent;
#                      some boards need the module loaded explicitly.
#   VM / cloud       — usually NOT, unless the hypervisor is configured
#                      to expose one (e.g. i6300esb on libvirt/KVM).
#
# With no /dev/watchdog these settings are inert: systemd notes it and
# carries on, and the "survives a kernel hang" guarantee simply is not
# there. That is a silent gap, so install.sh checks for the device and
# says which case you are in rather than letting you assume coverage.
# Confirm yourself any time with:  wdctl        (or: ls -l /dev/watchdog*)
#
# RuntimeWatchdogSec=15s — petted at 7.5s. Tolerates a brief CPU stall from
#   a heavy SQLite checkpoint or a storage hiccup, but a true hang triggers
#   reset within ~15 s.
#
#   The usable ceiling is set by the hardware, not by this file, and
#   systemd clamps to it: bcm2835_wdt (Pi) maxes at ~15-16 s, so 15 s is
#   at the ceiling there and must not be raised; iTCO_wdt on x86 allows
#   far longer. `wdctl` reports the timeout actually programmed — if it
#   does not read ~15 s, your hardware clamped it, which is fine.
#
#   The tradeoff is that a pathological storage stall on a heavily loaded
#   box could trip a spurious reset; mitigate by keeping the write load
#   modest, not by lengthening the timeout. install.sh verifies the
#   *armed* value (RuntimeWatchdogUSec) is non-zero after daemon-reexec.
# RebootWatchdogSec / ShutdownWatchdogSec=2min — keep the watchdog armed
#   across a graceful shutdown/reboot so a stalled stop/unmount can't brick
#   the box mid-transition.
#
# To verify after install + reboot:
#   sudo systemctl show | grep -i watchdog
#   wdctl                # shows hardware watchdog status
#
# To disable temporarily (e.g. for kernel debugging):
#   sudo systemctl edit --runtime --force --full systemd-system-config
#   set RuntimeWatchdogSec=0

[Manager]
RuntimeWatchdogSec=15s
RebootWatchdogSec=2min
ShutdownWatchdogSec=2min
